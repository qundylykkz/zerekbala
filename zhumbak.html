<!DOCTYPE html>
<html lang="kk">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ZEREK BALA - Суретті жұмбақтар әлемі</title>

  <!-- Google Fonts & Font Awesome Icons -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@500;600;700;800;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

  <!-- Tailwind CSS Framework CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: {
            sans: ['Montserrat', 'sans-serif'],
          },
          keyframes: {
            float: {
              '0%, 100%': { transform: 'translateY(0px)' },
              '50%': { transform: 'translateY(-10px)' },
            },
            bounceSlow: {
              '0%, 100%': { transform: 'translateY(0)' },
              '50%': { transform: 'translateY(-6px)' },
            },
            springBounce: {
              '0%': { transform: 'scale(0.85)', opacity: '0' },
              '60%': { transform: 'scale(1.05)' },
              '100%': { transform: 'scale(1)', opacity: '1' }
            },
            pulseGlow: {
              '0%, 100%': { opacity: '0.85', transform: 'scale(1)' },
              '50%': { opacity: '1', transform: 'scale(1.02)' }
            }
          },
          animation: {
            float: 'float 4s ease-in-out infinite',
            bounceSlow: 'bounceSlow 2.5s ease-in-out infinite',
            springBounce: 'springBounce 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards',
            pulseGlow: 'pulseGlow 2.5s ease-in-out infinite'
          }
        }
      }
    }
  </script>

  <style>
    body {
      font-family: 'Montserrat', sans-serif;
      background: linear-gradient(135deg, #e0f2fe 0%, #fef3c7 45%, #fce7f3 100%);
      min-height: 100vh;
      overflow-x: hidden;
    }
  </style>
</head>
<body class="relative flex items-center justify-center p-3 sm:p-6 text-slate-800 selection:bg-amber-200">

  <!-- Floating background decorations -->
  <div class="fixed inset-0 pointer-events-none overflow-hidden z-0 opacity-40">
    <div class="absolute top-5 left-6 text-yellow-400 text-3xl sm:text-5xl animate-float"><i class="fa-solid fa-cloud"></i></div>
    <div class="absolute top-36 right-8 text-pink-300 text-3xl sm:text-4xl animate-bounceSlow"><i class="fa-solid fa-star"></i></div>
    <div class="absolute bottom-20 left-10 text-purple-300 text-3xl sm:text-5xl animate-bounceSlow"><i class="fa-solid fa-lightbulb"></i></div>
    <div class="absolute bottom-10 right-10 text-emerald-300 text-4xl sm:text-6xl animate-float"><i class="fa-solid fa-sun"></i></div>
  </div>

  <!-- Main Game Container Card -->
  <main class="relative z-10 w-full max-w-xl bg-white/95 backdrop-blur-md rounded-3xl p-5 sm:p-8 shadow-2xl border-4 border-amber-300 space-y-6">
    
    <!-- Header with logo badge, title & stars/progress -->
    <header class="flex items-center justify-between border-b-2 border-amber-100 pb-4">
      <div class="flex items-center gap-3">
        <div class="w-12 h-12 rounded-2xl bg-gradient-to-tr from-amber-400 to-orange-500 text-white flex items-center justify-center text-2xl shadow-md animate-bounceSlow">
          🧩
        </div>
        <div>
          <span class="text-[10px] font-black text-amber-600 uppercase tracking-widest block">ZEREK BALA ОЙЫНДАРЫ</span>
          <h1 class="text-lg sm:text-2xl font-black text-slate-800">Суретті Жұмбақтар</h1>
        </div>
      </div>

      <!-- Live score / counter badge -->
      <div class="bg-amber-50 px-3.5 py-1.5 rounded-full border-2 border-amber-200 flex items-center gap-1.5 shadow-sm">
        <i class="fa-solid fa-star text-amber-500 text-xs sm:text-sm"></i>
        <span id="counter" class="text-xs sm:text-sm font-black text-amber-800">1 / 5</span>
      </div>
    </header>

    <!-- Riddle Box with Audio Trigger -->
    <section class="bg-gradient-to-r from-amber-50 to-orange-50 rounded-3xl p-4 sm:p-5 border-2 border-amber-200 shadow-inner space-y-3">
      <div class="flex items-center justify-between">
        <span class="inline-flex items-center gap-1.5 bg-white px-3 py-1 rounded-full text-[10px] sm:text-xs font-black text-amber-700 shadow-sm border border-amber-200">
          <i class="fa-solid fa-circle-question text-amber-500"></i> Жұмбақты оқы немесе тыңда:
        </span>

        <!-- Audio Listen Button (Always plays zhauaby.mp3, NO robotic speech) -->
        <button id="audio-btn" onclick="playAudio()" class="bg-gradient-to-r from-amber-500 to-orange-500 hover:from-amber-600 hover:to-orange-600 active:scale-95 text-white font-extrabold text-xs sm:text-sm px-4 py-2 rounded-full shadow-md transition transform flex items-center gap-2">
          <i id="audio-icon" class="fa-solid fa-volume-high text-xs sm:text-sm"></i>
          <span id="audio-btn-text">Тыңдау</span>
        </button>
      </div>

      <!-- Riddle Question Text -->
      <p id="riddle-text" class="text-base sm:text-lg font-bold text-slate-800 leading-relaxed min-h-[64px] flex items-center"></p>
    </section>

    <!-- Instruction hint -->
    <div class="text-center">
      <span class="text-[11px] sm:text-xs font-extrabold text-slate-500 uppercase tracking-wide">
        👇 Дұрыс жауабы бар суретті таңдаңыз:
      </span>
    </div>

    <!-- Options 2x2 Grid -->
    <div id="options-grid" class="grid grid-cols-2 gap-3.5 sm:gap-4"></div>

    <!-- Result Feedback Message & Next Button -->
    <section class="flex flex-col items-center justify-center min-h-[50px] space-y-3 pt-1">
      <div id="result-message" class="text-sm sm:text-base font-black transition-all"></div>
      
      <button id="next-btn" onclick="nextRiddle()" class="hidden bg-gradient-to-r from-sky-500 to-blue-600 hover:from-sky-600 hover:to-blue-700 active:scale-95 text-white font-black text-xs sm:text-sm px-8 py-3 rounded-2xl shadow-lg transition transform items-center gap-2">
        <span>Келесі жұмбақ</span>
        <i class="fa-solid fa-arrow-right"></i>
      </button>
    </section>

    <!-- Footer author note -->
    <footer class="pt-3 border-t border-slate-100 flex items-center justify-between text-[10px] sm:text-xs font-bold text-slate-400">
      <span>Zerek Bala Платформасы</span>
      <span class="text-amber-600">Отарова Әсел Сатыбалдықызы</span>
    </footer>

  </main>

  <!-- Hidden Audio Player for zhauaby files -->
  <audio id="riddle-audio-player" preload="auto"></audio>

  <script>
    // Rich SVG graphic assets for options
    const icons = {
      "Кәмпит": `<svg viewBox="0 0 100 100"><polygon points="10,25 35,50 10,75" fill="#f43f5e"/><polygon points="90,25 65,50 90,75" fill="#f43f5e"/><ellipse cx="50" cy="50" rx="26" ry="18" fill="#fbbf24"/><path d="M35 40 Q50 30 65 40 Q50 60 35 40" fill="#f43f5e"/><ellipse cx="50" cy="50" rx="7" ry="17" fill="#fb923c"/></svg>`,
      "Алма": `<svg viewBox="0 0 100 100"><path d="M50 25 Q45 10 55 5" stroke="#78350f" stroke-width="4" fill="none" stroke-linecap="round"/><path d="M52 15 Q65 10 65 20 Z" fill="#22c55e"/><path d="M30 30 C15 30 15 65 30 85 C42 92 48 85 50 82 C52 85 58 92 70 85 C85 65 85 30 70 30 C58 30 52 40 50 40 C48 40 42 30 30 30 Z" fill="#ef4444"/><ellipse cx="40" cy="45" rx="4" ry="10" fill="#fca5a5" opacity="0.6"/></svg>`,
      "Нан": `<svg viewBox="0 0 100 100"><path d="M20 55 Q20 30 50 30 Q80 30 80 55 Q80 75 50 75 Q20 75 20 55 Z" fill="#d97706"/><line x1="38" y1="40" x2="42" y2="55" stroke="#b45309" stroke-width="3" stroke-linecap="round"/><line x1="50" y1="38" x2="52" y2="57" stroke="#b45309" stroke-width="3" stroke-linecap="round"/><line x1="62" y1="40" x2="60" y2="55" stroke="#b45309" stroke-width="3" stroke-linecap="round"/></svg>`,
      "Балмұздақ": `<svg viewBox="0 0 100 100"><polygon points="35,50 65,50 50,90" fill="#f59e0b" stroke="#d97706" stroke-width="2"/><circle cx="50" cy="40" r="18" fill="#ec4899"/><circle cx="45" cy="30" r="14" fill="#38bdf8"/><circle cx="50" cy="20" r="5" fill="#ef4444"/></svg>`,
      "Тоңазытқыш": `<svg viewBox="0 0 100 100"><rect x="30" y="10" width="40" height="80" rx="8" fill="#e2e8f0" stroke="#64748b" stroke-width="3"/><line x1="30" y1="42" x2="70" y2="42" stroke="#64748b" stroke-width="3"/><rect x="34" y="24" width="4" height="10" rx="2" fill="#94a3b8"/><rect x="34" y="48" width="4" height="15" rx="2" fill="#94a3b8"/></svg>`,
      "Шкаф": `<svg viewBox="0 0 100 100"><rect x="25" y="15" width="50" height="70" rx="5" fill="#b45309" stroke="#78350f" stroke-width="3"/><line x1="50" y1="15" x2="50" y2="85" stroke="#78350f" stroke-width="2"/><circle cx="45" cy="50" r="3" fill="#fde047"/><circle cx="55" cy="50" r="3" fill="#fde047"/></svg>`,
      "Сөмке": `<svg viewBox="0 0 100 100"><path d="M40 30 Q50 15 60 30" fill="none" stroke="#0284c7" stroke-width="4"/><rect x="25" y="30" width="50" height="50" rx="8" fill="#38bdf8" stroke="#0284c7" stroke-width="3"/><rect x="42" y="45" width="16" height="12" rx="3" fill="#fde047"/></svg>`,
      "Үстел": `<svg viewBox="0 0 100 100"><rect x="15" y="40" width="70" height="10" rx="3" fill="#a16207"/><rect x="22" y="50" width="8" height="35" fill="#78350f"/><rect x="70" y="50" width="8" height="35" fill="#78350f"/></svg>`,
      "Теледидар": `<svg viewBox="0 0 100 100"><line x1="35" y1="15" x2="48" y2="28" stroke="#475569" stroke-width="3"/><line x1="65" y1="15" x2="52" y2="28" stroke="#475569" stroke-width="3"/><rect x="18" y="28" width="64" height="46" rx="6" fill="#334155"/><rect x="23" y="33" width="44" height="36" rx="4" fill="#38bdf8"/><circle cx="74" cy="42" r="3.5" fill="#f43f5e"/><circle cx="74" cy="54" r="3.5" fill="#22c55e"/><polygon points="40,43 53,51 40,59" fill="#ffffff"/></svg>`,
      "Кітап": `<svg viewBox="0 0 100 100"><path d="M20 30 Q50 35 50 75 Q20 70 20 30 Z" fill="#60a5fa"/><path d="M80 30 Q50 35 50 75 Q80 70 80 30 Z" fill="#3b82f6"/><line x1="50" y1="35" x2="50" y2="75" stroke="#1d4ed8" stroke-width="3"/></svg>`,
      "Сағат": `<svg viewBox="0 0 100 100"><circle cx="50" cy="50" r="35" fill="#fef08a" stroke="#ca8a04" stroke-width="4"/><line x1="50" y1="50" x2="50" y2="30" stroke="#854d0e" stroke-width="4" stroke-linecap="round"/><line x1="50" y1="50" x2="65" y2="50" stroke="#854d0e" stroke-width="4" stroke-linecap="round"/><circle cx="50" cy="50" r="4" fill="#854d0e"/></svg>`,
      "Үтік": `<svg viewBox="0 0 100 100"><path d="M20 65 L75 65 C85 65 85 55 75 45 L50 45 Q35 45 20 65 Z" fill="#06b6d4" stroke="#0891b2" stroke-width="3"/><path d="M35 45 L35 32 Q55 30 70 45" fill="none" stroke="#64748b" stroke-width="4"/></svg>`,
      "Қияр": `<svg viewBox="0 0 100 100"><rect x="25" y="40" width="55" height="22" rx="11" transform="rotate(-20 50 50)" fill="#16a34a"/><circle cx="45" cy="45" r="1.5" fill="#15803d"/><circle cx="55" cy="52" r="1.5" fill="#15803d"/></svg>`,
      "Банан": `<svg viewBox="0 0 100 100"><path d="M30 25 Q65 35 70 75 Q50 65 30 25 Z" fill="#fde047" stroke="#ca8a04" stroke-width="2"/><path d="M30 25 L27 22" stroke="#65a30d" stroke-width="4" stroke-linecap="round"/></svg>`,
      "Қарбыз": `<svg viewBox="0 0 100 100"><path d="M20 50 A30 30 0 0 0 80 50 Z" fill="#ef4444" stroke="#15803d" stroke-width="5"/><circle cx="40" cy="58" r="2" fill="#000"/><circle cx="50" cy="63" r="2" fill="#000"/><circle cx="60" cy="58" r="2" fill="#000"/></svg>`,
      "Пияз": `<svg viewBox="0 0 100 100"><path d="M50 20 Q48 10 40 5 M50 20 Q52 8 60 5" stroke="#16a34a" stroke-width="4" stroke-linecap="round" fill="none"/><path d="M50 20 C25 25 20 65 50 82 C80 65 75 25 50 20 Z" fill="#ea580c"/><path d="M50 20 C36 28 34 68 50 82 C66 68 64 28 50 20 Z" fill="#f97316"/><line x1="50" y1="20" x2="50" y2="82" stroke="#c2410c" stroke-width="2"/><line x1="48" y1="82" x2="46" y2="89" stroke="#fed7aa" stroke-width="2"/><line x1="52" y1="82" x2="54" y2="89" stroke="#fed7aa" stroke-width="2"/></svg>`,
      "Сәбіз": `<svg viewBox="0 0 100 100"><path d="M50 25 L45 10 M50 25 L50 8 M50 25 L55 10" stroke="#22c55e" stroke-width="3" stroke-linecap="round"/><polygon points="40,25 60,25 50,85" fill="#f97316"/><line x1="44" y1="40" x2="52" y2="40" stroke="#ea580c" stroke-width="2"/><line x1="48" y1="55" x2="56" y2="55" stroke="#ea580c" stroke-width="2"/></svg>`,
      "Картоп": `<svg viewBox="0 0 100 100"><ellipse cx="50" cy="52" rx="28" ry="20" fill="#ca8a04"/><circle cx="42" cy="46" r="1.5" fill="#854d0e"/><circle cx="58" cy="55" r="1.5" fill="#854d0e"/><circle cx="48" cy="60" r="1.5" fill="#854d0e"/></svg>`,
      "Апельсин": `<svg viewBox="0 0 100 100"><circle cx="50" cy="52" r="28" fill="#f97316"/><circle cx="50" cy="24" r="3" fill="#15803d"/><path d="M50 24 Q58 18 62 25 Z" fill="#22c55e"/></svg>`
    };

    // Riddles dataset configured with direct zhauaby audio files
    const riddles = [
      {
        text: "Өзі қатты, өзі тәтті,\nАуыртады тісіңді.\nБірақ, бәрі ұнатады,\nБолған соң түрлі пішінді.",
        audioFiles: ["audio/zhauaby1.mp3", "zhauaby1.mp3", "audio/zhauaby1.mp3"],
        answer: "Кәмпит",
        options: ["Кәмпит", "Алма", "Нан", "Балмұздақ"]
      },
      {
        text: "Өзі суық, қатты,\nСақтайды барлық затты.",
        audioFiles: ["audio/zhauaby2.mp3", "zhauaby2.mp3", "audio/zhauaby2.mp3"],
        answer: "Тоңазытқыш",
        options: ["Шкаф", "Тоңазытқыш", "Сөмке", "Үстел"]
      },
      {
        text: "Барлық жан оны көреді,\nТүрлі ақпарат береді.",
        audioFiles: ["audio/zhauaby3.mp3", "zhauaby3.mp3", "audio/zhauaby3.mp3"],
        answer: "Теледидар",
        options: ["Кітап", "Сағат", "Теледидар", "Үтік"]
      },
      {
        text: "Дөңгелек өзі,\nҚызыл, жасыл түсі.\nАғашта өседі, \nКөп дәрумен береді.",
        audioFiles: ["audio/zhauaby4.mp3", "zhauaby4.mp3", "audio/zhauaby4.mp3"],
        answer: "Алма",
        options: ["Алма", "Қияр", "Банан", "Қарбыз"]
      },
      {
        text: "Қызғылт сары түсі бар,\nӨзіне тән иісі бар.\nТілсең көзге жас келер,\nБұл не болды, кім табар?",
        audioFiles: ["audio/zhauaby5.mp3", "zhauaby5.mp3", "audio/zhauaby5.mp3"],
        answer: "Пияз",
        options: ["Сәбіз", "Пияз", "Картоп", "Апельсин"]
      }
    ];

    let currentIndex = 0;
    let score = 0;

    const audioPlayer = document.getElementById("riddle-audio-player");
    const riddleText = document.getElementById("riddle-text");
    const optionsGrid = document.getElementById("options-grid");
    const resultMessage = document.getElementById("result-message");
    const nextBtn = document.getElementById("next-btn");
    const counterText = document.getElementById("counter");
    const audioBtn = document.getElementById("audio-btn");
    const audioIcon = document.getElementById("audio-icon");
    const audioBtnText = document.getElementById("audio-btn-text");

    // Synthesized gentle notification chime (strictly no robot speech voice)
    function playChimeTone(isSuccess) {
      try {
        const AudioCtx = window.AudioContext || window.webkitAudioContext;
        if (!AudioCtx) return;
        const ctx = new AudioCtx();
        const osc = ctx.createOscillator();
        const gain = ctx.createGain();

        osc.type = "sine";
        osc.frequency.setValueAtTime(isSuccess ? 659.25 : 329.63, ctx.currentTime); // E5 or E4
        if (isSuccess) {
          osc.frequency.exponentialRampToValueAtTime(880, ctx.currentTime + 0.15); // A5
        }

        gain.gain.setValueAtTime(0.2, ctx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + 0.35);

        osc.connect(gain);
        gain.connect(ctx.destination);
        osc.start();
        osc.stop(ctx.currentTime + 0.36);
      } catch (e) {
        console.log("Audio API optional chime unhandled");
      }
    }

    function stopAudio() {
      // 100% suppress any browser speech bot voice
      if ('speechSynthesis' in window) {
        window.speechSynthesis.cancel();
      }
      if (audioPlayer) {
        audioPlayer.pause();
        audioPlayer.currentTime = 0;
      }
      if (audioIcon && audioBtnText) {
        audioIcon.className = "fa-solid fa-volume-high text-xs sm:text-sm";
        audioBtnText.textContent = "Тыңдау";
      }
    }

    // Play assigned zhauaby mp3 file
    function playAudio() {
      stopAudio();

      const currentItem = riddles[currentIndex];
      const audioSources = currentItem.audioFiles || [];

      let played = false;
      let fileIdx = 0;

      function tryNextPath() {
        if (fileIdx >= audioSources.length) {
          // If no local mp3 file exists, play a musical chime instead of any bot voice
          playChimeTone(true);
          return;
        }

        audioPlayer.src = audioSources[fileIdx];
        audioPlayer.play().then(() => {
          played = true;
          audioIcon.className = "fa-solid fa-pause text-xs sm:text-sm";
          audioBtnText.textContent = "Ойнауда...";
        }).catch(() => {
          fileIdx++;
          tryNextPath();
        });
      }

      tryNextPath();

      audioPlayer.onended = () => {
        audioIcon.className = "fa-solid fa-volume-high text-xs sm:text-sm";
        audioBtnText.textContent = "Қайталау";
      };
    }

    function loadRiddle() {
      stopAudio();

      const item = riddles[currentIndex];
      riddleText.innerText = item.text;
      counterText.innerText = `${currentIndex + 1} / ${riddles.length}`;
      optionsGrid.innerHTML = "";
      resultMessage.innerText = "";
      nextBtn.classList.add("hidden");

      item.options.forEach(optName => {
        const card = document.createElement("button");
        card.type = "button";
        card.className = "group relative bg-white hover:bg-amber-50/70 p-3.5 sm:p-4 rounded-3xl border-3 border-slate-200 hover:border-amber-400 shadow-sm hover:shadow-lg transition-all duration-200 transform hover:-translate-y-1 active:scale-95 flex flex-col items-center justify-between gap-2.5 outline-none";
        
        card.innerHTML = `
          <div class="w-16 h-16 sm:w-20 sm:h-20 flex items-center justify-center group-hover:scale-105 transition transform duration-200">
            ${icons[optName] || '<span class="text-4xl">🌟</span>'}
          </div>
          <span class="text-sm sm:text-base font-black text-slate-700 group-hover:text-amber-700 transition">${optName}</span>
        `;
        
        card.onclick = () => checkAnswer(card, optName, item.answer);
        optionsGrid.appendChild(card);
      });
    }

    function checkAnswer(selectedCard, selectedName, correctName) {
      // Disable multiple clicks
      const cards = optionsGrid.querySelectorAll("button");
      cards.forEach(card => card.disabled = true);

      if (selectedName === correctName) {
        selectedCard.className = "relative bg-emerald-50 p-3.5 sm:p-4 rounded-3xl border-4 border-emerald-500 shadow-md flex flex-col items-center justify-between gap-2.5 animate-springBounce";
        selectedCard.querySelector("span").className = "text-sm sm:text-base font-black text-emerald-800";
        
        resultMessage.className = "text-sm sm:text-base font-black text-emerald-600 flex items-center gap-1.5 animate-bounce";
        resultMessage.innerHTML = `<i class="fa-solid fa-circle-check text-lg"></i> Дұрыс! Жарайсың, балақай! 👏🎉 (+3 ⭐)`;
        
        score++;
        playChimeTone(true);
      } else {
        selectedCard.className = "relative bg-rose-50 p-3.5 sm:p-4 rounded-3xl border-4 border-rose-400 opacity-80 flex flex-col items-center justify-between gap-2.5";
        selectedCard.querySelector("span").className = "text-sm sm:text-base font-black text-rose-800";

        resultMessage.className = "text-sm sm:text-base font-black text-rose-600 flex items-center gap-1.5";
        resultMessage.innerHTML = `<i class="fa-solid fa-circle-xmark text-lg"></i> Қате! Дұрыс жауабы: <b>«${correctName}»</b>`;

        // Highlight the correct card
        cards.forEach(card => {
          if (card.querySelector("span").innerText.trim() === correctName) {
            card.className = "relative bg-emerald-50 p-3.5 sm:p-4 rounded-3xl border-4 border-emerald-500 shadow-md flex flex-col items-center justify-between gap-2.5 animate-pulse";
            card.querySelector("span").className = "text-sm sm:text-base font-black text-emerald-800";
          }
        });
        playChimeTone(false);
      }

      nextBtn.classList.remove("hidden");
      nextBtn.classList.add("inline-flex");
    }

    function nextRiddle() {
      stopAudio();
      currentIndex++;
      if (currentIndex < riddles.length) {
        loadRiddle();
      } else {
        showFinalResult();
      }
    }

    function showFinalResult() {
      stopAudio();
      riddleText.innerHTML = `
        <div class="text-center w-full py-2 space-y-1">
          <div class="text-4xl animate-bounce">🏆</div>
          <h3 class="text-lg sm:text-xl font-black text-amber-600">КЕРЕМЕТ ТАПҚЫРСЫҢ!</h3>
          <p class="text-xs sm:text-sm font-extrabold text-slate-700">Барлық жұмбақты ойдағыдай шешіп шықтың!</p>
          <div class="text-base sm:text-lg font-black text-emerald-600 pt-1">
            Нәтиже: ${score} / ${riddles.length} жұмбақ дұрыс табылған! 🌟
          </div>
        </div>
      `;
      optionsGrid.innerHTML = "";
      resultMessage.innerText = "";
      if (audioBtn) audioBtn.classList.add("hidden");

      nextBtn.innerHTML = `<span>Қайта ойнау</span> <i class="fa-solid fa-rotate-right"></i>`;
      nextBtn.onclick = restartQuiz;
      nextBtn.classList.remove("hidden");
      nextBtn.classList.add("inline-flex");
      counterText.innerText = "Ойын аяқталды";
      playChimeTone(true);
    }

    function restartQuiz() {
      currentIndex = 0;
      score = 0;
      if (audioBtn) audioBtn.classList.remove("hidden");
      nextBtn.innerHTML = `<span>Келесі жұмбақ</span> <i class="fa-solid fa-arrow-right"></i>`;
      nextBtn.onclick = nextRiddle;
      loadRiddle();
    }

    // Initialize initial riddle on startup
    window.addEventListener("DOMContentLoaded", () => {
      // Clear any pending browser speech synthesis
      if ('speechSynthesis' in window) {
        window.speechSynthesis.cancel();
      }
      loadRiddle();
    });
  </script>
</body>
</html>
