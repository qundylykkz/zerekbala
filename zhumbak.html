<!DOCTYPE html>
<html lang="kk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Зерек бала - Суретті жұмбақтар</title>
    <style>
        * {
            box-sizing: border-box;
            font-family: 'Comic Sans MS', 'Arial Rounded MT Bold', sans-serif;
        }
        body {
            background: linear-gradient(135deg, #e0f2fe 0%, #fef3c7 100%);
            color: #1e293b;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            padding: 15px;
        }
        .container {
            background: #ffffff;
            width: 100%;
            max-width: 600px;
            padding: 25px;
            border-radius: 28px;
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.1);
            text-align: center;
            border: 4px solid #38bdf8;
        }
        .header-title {
            font-size: 28px;
            color: #0284c7;
            margin-bottom: 5px;
            font-weight: 900;
        }
        .counter {
            font-size: 16px;
            color: #64748b;
            margin-bottom: 15px;
            font-weight: 700;
        }

        .riddle-box {
            background: #f0f9ff;
            border: 2px dashed #0284c7;
            border-radius: 20px;
            padding: 15px 20px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 15px;
            margin-bottom: 20px;
            text-align: left;
        }
        .riddle-text {
            font-size: 19px;
            line-height: 1.5;
            white-space: pre-line;
            color: #0f172a;
            font-weight: 600;
        }
        .audio-btn {
            background: #f59e0b;
            color: white;
            border: none;
            padding: 10px 18px;
            border-radius: 50px;
            font-size: 17px;
            font-weight: bold;
            cursor: pointer;
            display: inline-flex;
            align-items: center;
            gap: 8px;
            box-shadow: 0 4px 12px rgba(245, 158, 11, 0.3);
            transition: transform 0.2s, background 0.2s;
            white-space: nowrap;
        }
        .audio-btn:hover {
            transform: scale(1.05);
            background: #d97706;
        }

        .images-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 16px;
            margin-bottom: 20px;
        }
        .image-card {
            background: #ffffff;
            border: 3px solid #e2e8f0;
            border-radius: 20px;
            padding: 12px;
            cursor: pointer;
            transition: all 0.25s ease;
            display: flex;
            flex-direction: column;
            align-items: center;
            box-shadow: 0 4px 10px rgba(0,0,0,0.04);
        }
        .image-card:hover {
            border-color: #38bdf8;
            transform: translateY(-4px) scale(1.02);
            box-shadow: 0 8px 18px rgba(56, 189, 248, 0.2);
        }
        .svg-icon {
            width: 90px;
            height: 90px;
            margin-bottom: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .svg-icon svg {
            width: 100%;
            height: 100%;
        }
        .image-card span {
            font-size: 18px;
            font-weight: 700;
            color: #334155;
        }
        .image-card.correct {
            border-color: #22c55e !important;
            background: #dcfce7 !important;
            animation: bounce 0.5s ease;
        }
        .image-card.wrong {
            border-color: #ef4444 !important;
            background: #fee2e2 !important;
            opacity: 0.6;
        }
        @keyframes bounce {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.08); }
        }

        .result-panel {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 10px;
            margin-bottom: 15px;
        }
        .message {
            font-size: 20px;
            font-weight: 800;
            min-height: 32px;
        }
        .next-btn {
            background: #0284c7;
            color: white;
            border: none;
            padding: 12px 30px;
            font-size: 18px;
            font-weight: bold;
            border-radius: 14px;
            cursor: pointer;
            display: none;
            margin: 0 auto;
            box-shadow: 0 4px 14px rgba(2, 132, 199, 0.3);
            transition: all 0.2s;
        }
        .next-btn:hover {
            background: #0369a1;
            transform: scale(1.03);
        }
    </style>
</head>
<body>

<div class="container">
    <div class="header-title">Зерек бала 💡</div>
    <div class="counter" id="counter">Жұмбақ 1 / 5</div>

    <div class="riddle-box">
        <div class="riddle-text" id="riddle-text">Жұмбақ жүктелуде...</div>
        <!-- Бір ғана Тыңдау батырмасы -->
        <button class="audio-btn" id="audio-btn" title="Тыңдау" onclick="playAudio()">
            🔊 Тыңдау
        </button>
    </div>

    <div class="images-grid" id="options-grid"></div>

    <div class="result-panel">
        <div class="message" id="result-message"></div>
    </div>

    <button class="next-btn" id="next-btn" onclick="nextRiddle()">Келесі жұмбақ ➡️</button>
</div>

<script>
    const icons = {
        "Кәмпит": `<svg viewBox="0 0 100 100"><polygon points="10,25 35,50 10,75" fill="#f43f5e"/><polygon points="90,25 65,50 90,75" fill="#f43f5e"/><ellipse cx="50" cy="50" rx="26" ry="18" fill="#fbbf24"/><path d="M35 40 Q50 30 65 40 Q50 60 35 40" fill="#f43f5e"/><ellipse cx="50" cy="50" rx="7" ry="17" fill="#fb923c"/></svg>`,
        "Алма": `<svg viewBox="0 0 100 100"><path d="M50 25 Q45 10 55 5" stroke="#78350f" stroke-width="4" fill="none" stroke-linecap="round"/><path d="M52 15 Q65 10 65 20 Z" fill="#22c55e"/><path d="M30 30 C15 30 15 65 30 85 C42 92 48 85 50 82 C52 85 58 92 70 85 C85 65 85 30 70 30 C58 30 52 40 50 40 C48 40 42 30 30 30 Z" fill="#ef4444"/><ellipse cx="40" cy="45" rx="4" ry="10" fill="#fca5a5" opacity="0.6"/></svg>`,
        "Нан": `<svg viewBox="0 0 100 100"><path d="M20 55 Q20 30 50 30 Q80 30 80 55 Q80 75 50 75 Q20 75 20 55 Z" fill="#d97706"/><line x1="38" y1="40" x2="42" y2="55" stroke="#b45309" stroke-width="3" stroke-linecap="round"/><line x1="50" y1="38" x2="52" y2="57" stroke="#b45309" stroke-width="3" stroke-linecap="round"/><line x1="62" y1="40" x2="60" y2="55" stroke="#b45309" stroke-width="3" stroke-linecap="round"/></svg>`,
        "Балмұздақ": `<svg viewBox="0 0 100 100"><polygon points="35,50 65,50 50,90" fill="#f59e0b" stroke="#d97706" stroke-width="2"/><circle cx="50" cy="40" r="18" fill="#ec4899"/><circle cx="45" cy="30" r="14" fill="#38bdf8"/><circle cx="50" cy="20" r="5" fill="#ef4444"/></svg>`,
        "Тоңазытқыш": `<svg viewBox="0 0 100 100"><rect x="30" y="10" width="40" height="80" rx="8" fill="#e2e8f0" stroke="#64748b" stroke-width="3"/><line x1="30" y1="42" x2="70" y2="42" stroke="#64748b" stroke-width="3"/><rect x="34" y="24" width="4" height="10" rx="2" fill="#94a3b8"/><rect x="34" y="48" width="4" height="15" rx="2" fill="#94a3b8"/></svg>`,
        "Шкаф": `<svg viewBox="0 0 100 100"><rect x="25" y="15" width="50" height="70" rx="5" fill="#b45309" stroke="#78350f" stroke-width="3"/><line x1="50" y1="15" x2="50" y2="85" stroke="#78350f" stroke-width="2"/><circle cx="45" cy="50" r="3" fill="#fde047"/><circle cx="55" cy="50" r="3" fill="#fde047"/></svg>`,
        "Сөмке": `<svg viewBox="0 0 100 100"><path d="M40 30 Q50 15 60 30" fill="none" stroke="#0284c7" stroke-width="4"/><rect x="25" y="30" width="50" height="50" rx="8" fill="#38bdf8" stroke="#0284c7" stroke-width="3"/><rect x="42" y="45" width="16" height="12" rx="3" fill="#fde047"/></svg>`,
        "Үстел": `<svg viewBox="0 0 100 100"><rect x="15" y="40" width="70" height="10" rx="3" fill="#a16207"/><rect x="22" y="50" width="8" height="35" fill="#78350f"/><rect x="70" y="50" width="8" height="35" fill="#78350f"/></svg>`,
        "Теледидар": `<svg viewBox="0 0 100 100"><line x1="35" y1="15" x2="48" y2="28" stroke="#475569" stroke-width="3"/><line x1="65" y1="15" x2="52" y2="28" stroke="#475569" stroke-width="3"/><rect x="18" y="28" width="64" height="46" rx="6" fill="#334155"/><rect x="23" y="33" width="44" height="36" rx="4" fill="#38bdf8"/><circle cx="74" cy="42" r="3.5" fill="#f43f5e"/><circle cx="74" cy="54" r="3.5" fill="#22c55e"/><polygon points="40,43 53,51 40,59" fill="#ffffff"/></svg>`,
        "Кітап": `<svg viewBox="0 0 100 100"><path d="M20 30 Q50 35 50 75 Q20 70 20 30 Z" fill="#60a5fa"/><path d="M80 30 Q50 35 50 75 Q80 70 80 30 Z" fill="#3b82f6"/><line x1="50" y1="35" x2="50" y2="75" stroke="#1d4ed8" stroke-width="3"/></svg>`,
        "Сағат": `<svg viewBox="0 0 100 100"><circle cx="50" cy="50" r="35" fill="#fef08a" stroke="#ca8a04" stroke-width="4"/><line x1="50" y1="50" x2="50" y2="30" stroke="#854d0e" stroke-width="4" stroke-linecap="round"/><line x1="50" y1="50" x2="65" y2="50" stroke="#854d0e" stroke-width="4" stroke-linecap="round"/><circle cx="50" cy="50" r="4" fill="#854d0e"/></svg>`,
        "Үтік": `<svg viewBox="0 0 100 100"><path d="M20 65 L75 65 C85 65 85 55 75 45 L50 45 Q35 45 20 65 Z" fill="#06b6d4" stroke="#0891b2" stroke-width="3"/><path d="M35 45 L35 32 Q55 30 70 45" fill="none" stroke="#64748b" stroke-width="4"/></svg>`,
        "Қияр": `<svg viewBox="0 0 100 100"><rect x="25" y="40" width="55" height="22" rx="11" transform="rotate(-20 50 50)" fill="#16a34a"/><circle cx="45" cy="45" r="1.5" fill="#15803d"/><circle cx="55" cy="52" r="1.5" fill="#15803d"/></svg>`,
        "Банан": `<svg viewBox="0 0 100 100"><path d="M30 25 Q65 35 70 75 Q50 65 30 25 Z" fill="#fde047" stroke="#ca8a04" stroke-width="2"/><path d="M30 25 L27 22" stroke="#65a30d" stroke-width="4" stroke-linecap="round"/></svg>`,
        "Қарбыз": `<svg viewBox="0 0 100 100"><path d="M20 50 A30 30 0 0 0 80 50 Z" fill="#ef4444" stroke="#15803d" stroke-width="5"/><circle cx="40" cy="58" r="2" fill="#000"/><circle cx="50" cy="63" r="2" fill="#000"/><circle cx="60" cy="58" r="2" fill="#000"/></svg>`,
        "Пияз": `<svg viewBox="0 0 100 100"><path d="M50 20 Q48 10 40 5 M50 20 Q52 8 60 5" stroke="#16a34a" stroke-width="4" stroke-linecap="round" fill="none"/><path d="M50 20 C25 25 20 65 50 82 C80 65 75 25 50 20 Z" fill="#ea580c"/><path d="M50 20 C36 28 34 68 50 82 C66 68 64 28 50 20 Z" fill="#f97316"/><line x1="50" y1="20" x2="50" y2="82" stroke="#c2410c" stroke-width="2"/><line x1="48" y1="82" x2="46" y2="89" stroke="#fed7aa" stroke-width="2"/><line x1="52" y1="82" x2="54" y2="89" stroke="#fed7aa" stroke-width="2"/></svg>`,
        "Сәбіз": `<svg viewBox="0 0 100 100"><path d="M50 25 L45 10 M50 25 L50 8 M50 25 L55 10" stroke="#22c55e" stroke-width="3" stroke-linecap="round"/><polygon points="40,25 60,25 50,85" fill="#f97316"/><line x1="44" y1="40" x2="52" y2="40" stroke="#ea580c" stroke-width="2"/><line x1="48" y1="55" x2="56" y2="55" stroke="#ea580c" stroke-width="2"/></svg>`,
        "Картоп": `<svg viewBox="0 0 100 100"><ellipse cx="50" cy="52" rx="28" ry="20" fill="#ca8a04"/><circle cx="42" cy="46" r="1.5" fill="#854d0e"/><circle cx="58" cy="55" r="1.5" fill="#854d0e"/><circle cx="48" cy="60" r="1.5" fill="#854d0e"/></svg>`,
        "Апельсин": `<svg viewBox="0 0 100 100"><circle cx="50" cy="52" r="28" fill="#f97316"/><circle cx="50" cy="24" r="3" fill="#15803d"/><path d="M50 24 Q58 18 62 25 Z" fill="#22c55e"/></svg>`
    };

    // Мұнда 'audioFile' параметріне zauaby1.mp3, zauaby2.mp3 және т.б. сілтемелерді көрсетуге болады
    const riddles = [
        {
            text: "Өзі қатты, өзі тәтті,\nАуыртады тісіңді.\nБірақ, бәрі ұнатады,\nБолған соң түрлі пішінді.",
            audioFile: "audio/zauaby1.mp3",
            answer: "Кәмпит",
            options: ["Кәмпит", "Алма", "Нан", "Балмұздақ"]
        },
        {
            text: "Өзі суық, қатты,\nСақтайды барлық затты.",
            audioFile: "audio/zauaby2.mp3",
            answer: "Тоңазытқыш",
            options: ["Шкаф", "Тоңазытқыш", "Сөмке", "Үстел"]
        },
        {
            text: "Барлық жан оны көреді,\nТүрлі ақпарат береді.",
            audioFile: "audio/zauaby3.mp3",
            answer: "Теледидар",
            options: ["Кітап", "Сағат", "Теледидар", "Үтік"]
        },
        {
            text: "Дөңгелек өзі,\nҚызыл, жасыл түсі\nАғашта өседі, \nКөп дәрумен береді.",
            audioFile: "audio/zauaby4.mp3",
            answer: "Алма",
            options: ["Алма", "Қияр", "Банан", "Қарбыз"]
        },
        {
            text: "Қызғылт сары түсі бар\nӨзіне тән иісі бар.\nТілсең көзге жас келер\nБұл не болды, кім табар?",
            audioFile: "audio/zauaby5.mp3",
            answer: "Пияз",
            options: ["Сәбіз", "Пияз", "Картоп", "Апельсин"]
        }
    ];

    let currentIndex = 0;
    let score = 0;
    
    let audioElement = new Audio();

    const riddleText = document.getElementById("riddle-text");
    const optionsGrid = document.getElementById("options-grid");
    const resultMessage = document.getElementById("result-message");
    const nextBtn = document.getElementById("next-btn");
    const counterText = document.getElementById("counter");
    const audioBtn = document.getElementById("audio-btn");

    function playClapSound() {
        try {
            const AudioContext = window.AudioContext || window.webkitAudioContext;
            const ctx = new AudioContext();

            for (let i = 0; i < 6; i++) {
                setTimeout(() => {
                    const bufferSize = ctx.sampleRate * 0.08;
                    const buffer = ctx.createBuffer(1, bufferSize, ctx.sampleRate);
                    const data = buffer.getChannelData(0);
                    for (let j = 0; j < bufferSize; j++) {
                        data[j] = Math.random() * 2 - 1;
                    }

                    const noise = ctx.createBufferSource();
                    noise.buffer = buffer;

                    const filter = ctx.createBiquadFilter();
                    filter.type = 'bandpass';
                    filter.frequency.value = 1100;
                    filter.Q.value = 2.5;

                    const gain = ctx.createGain();
                    gain.gain.setValueAtTime(0.7, ctx.currentTime);
                    gain.gain.exponentialRampToValueAtTime(0.01, ctx.currentTime + 0.08);

                    noise.connect(filter);
                    filter.connect(gain);
                    gain.connect(ctx.destination);

                    noise.start();
                }, i * 90);
            }
        } catch (e) {
            console.log("Дыбыс ойнату қолдау көрсетпейді");
        }
    }

    function loadRiddle() {
        // Барлық дыбысты тоқтату (автоматикасыз)
        stopAudio();

        const item = riddles[currentIndex];
        riddleText.innerText = item.text;
        counterText.innerText = `Жұмбақ ${currentIndex + 1} / ${riddles.length}`;
        optionsGrid.innerHTML = "";
        resultMessage.innerText = "";
        nextBtn.style.display = "none";

        item.options.forEach(optName => {
            const card = document.createElement("div");
            card.className = "image-card";
            card.innerHTML = `
                <div class="svg-icon">${icons[optName] || ''}</div>
                <span>${optName}</span>
            `;
            card.onclick = () => checkAnswer(card, optName, item.answer);
            optionsGrid.appendChild(card);
        });
    }

    function stopAudio() {
        if ('speechSynthesis' in window) {
            window.speechSynthesis.cancel();
        }
        audioElement.pause();
        audioElement.currentTime = 0;
    }

    // Аудионы қолмен басып тыңдау
    function playAudio() {
        stopAudio();
        const item = riddles[currentIndex];
        audioElement.src = item.audioFile;
        audioElement.play().catch(() => {
            // Егер mp3 табылмаса, браузер сөйлеу жүйесін іске қосады
            if ('speechSynthesis' in window) {
                const cleanText = item.text.replace(/\n/g, ' ');
                const utterance = new SpeechSynthesisUtterance(cleanText);
                utterance.lang = 'kk-KZ';
                utterance.rate = 0.9;
                window.speechSynthesis.speak(utterance);
            }
        });
    }

    function checkAnswer(selectedCard, selectedName, correctName) {
        const cards = optionsGrid.querySelectorAll(".image-card");
        cards.forEach(card => card.style.pointerEvents = "none");

        if (selectedName === correctName) {
            selectedCard.classList.add("correct");
            resultMessage.style.color = "#16a34a";
            resultMessage.innerText = "Дұрыс! Жарайсың! 👏🎉";
            score++;
            playClapSound();
        } else {
            selectedCard.classList.add("wrong");
            resultMessage.style.color = "#dc2626";
            resultMessage.innerText = `Қате! Дұрыс жауабы: ${correctName}`;

            cards.forEach(card => {
                if (card.querySelector("span").innerText === correctName) {
                    card.classList.add("correct");
                }
            });
        }
        nextBtn.style.display = "block";
    }

    function nextRiddle() {
        stopAudio();
        currentIndex++;
        if (currentIndex < riddles.length) {
            loadRiddle();
        } else {
            showFinalResult();
        }
    }

    function showFinalResult() {
        stopAudio();
        riddleText.style.textAlign = "center";
        riddleText.innerHTML = `<h3>Керемет нәтиже! 🌟</h3>Барлық жұмбақ шешілді.<br>Жинаған ұпайың: <b>${score} / ${riddles.length}</b>`;
        optionsGrid.innerHTML = "";
        resultMessage.innerText = "";
        if (audioBtn) audioBtn.style.display = "none";
        nextBtn.innerText = "Қайта бастау 🔄";
        nextBtn.onclick = restartQuiz;
        nextBtn.style.display = "block";
        counterText.innerText = "Ойын аяқталды";
        playClapSound();
    }

    function restartQuiz() {
        currentIndex = 0;
        score = 0;
        if (audioBtn) audioBtn.style.display = "inline-flex";
        riddleText.style.textAlign = "left";
        nextBtn.innerText = "Келесі жұмбақ ➡️";
        loadRiddle();
    }

    // Қолданбаны іске қосу
    loadRiddle();
</script>

</body>
</html>
